<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeepVision 运维诊断中心</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
        body { background-color: #F0FDF4; font-family: 'PingFang SC', system-ui, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); transition: all 0.4s ease; }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(16, 185, 129, 0.1); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .PR-chart-bg { background: linear-gradient(135deg, #fff 0%, #f0fdf4 100%); }
        /* 自定义滑块样式 */
        input[type=range] { -webkit-appearance: none; background: #d1fae5; height: 8px; border-radius: 10px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #10b981; cursor: pointer; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-6 md:p-10">

<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
        <div>
            <div class="flex items-center space-x-3 mb-2">
                <span class="flex h-3 w-3"><span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>
                <span class="text-xs font-black text-emerald-600 uppercase tracking-[0.3em]">垃圾分类模型监控与专家诊断中心</span>
            </div>
            <h1 class="text-4xl font-black text-slate-800 tracking-tighter italic">DeepVision 运维诊断中心</h1>
        </div>
        <div class="flex space-x-4">
            <button onclick="localStorage.removeItem('garbage_history'); location.reload();" class="px-6 py-2 bg-red-50 text-red-500 rounded-full text-xs font-bold hover:bg-red-500 hover:text-white transition shadow-sm">清空数据</button>
            <button onclick="location.href='index.html'" class="px-6 py-2 bg-emerald-500 text-white rounded-full text-xs font-bold hover:bg-emerald-600 transition shadow-lg shadow-emerald-200">返回预测中心</button>
        </div>
    </header>

    <!-- 顶部四指标：引入翻牌器效果 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="glass-card p-6 border-b-4 border-emerald-500">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-1">总样本审计量</p>
            <h2 id="stat-total" class="text-3xl font-black text-slate-800 mono">0</h2>
        </div>
        <div class="glass-card p-6 border-b-4 border-blue-500">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-1">平均精确率 (P)</p>
            <h2 id="stat-p" class="text-3xl font-black text-blue-600 mono">0%</h2>
        </div>
        <div class="glass-card p-6 border-b-4 border-indigo-500">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-1 flex justify-between">全系统 F1 <span class="cursor-help" title="F1 = 2 * (P * R) / (P + R)">ⓘ</span></p>
            <h2 id="stat-f1" class="text-3xl font-black text-indigo-600 mono">0.00</h2>
        </div>
        <div class="glass-card p-6 border-b-4 border-orange-500">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-1">待校准样本</p>
            <h2 id="stat-anno" class="text-3xl font-black text-orange-600 mono">0</h2>
        </div>
    </div>

    <!-- 核心运维区：语义漂移与性能心电图 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
        <div class="lg:col-span-2 glass-card p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest">推理引擎实时性能</h3>
                <div class="text-[10px] bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold">硬件加速：已启用</div>
            </div>
            <div id="heartbeat-chart" class="w-full h-48"></div>
        </div>
        <div class="glass-card p-8 flex flex-col justify-between">
            <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-4">推理来源分析</h3>
            <div id="drift-status" class="mb-4">
                <p id="drift-msg" class="text-xs text-slate-500 font-bold leading-relaxed">正在根据 history.method 实时统计推理来源占比。</p>
            </div>
            <div id="source-chart" style="width:100%;height:200px;margin-top:24px"></div>
            <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mt-4">实时推理流水</h4>
            <div id="live-logs" class="mt-2 overflow-auto max-h-36 text-[12px] text-slate-600"></div>
        </div>
    </div>

    <!-- 算法策略区：P-R 权衡调节 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-8 glass-card p-8">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest">精确率-召回率 动态权衡滑块</h3>
                <span id="threshold-label" class="bg-emerald-500 text-white px-4 py-1 rounded-full font-mono text-sm">阈值: 0.60</span>
            </div>
            <input type="range" id="threshold-slider" min="1" max="99" value="60" class="w-full mb-6">
            <div class="grid grid-cols-2 gap-10">
                <div>
                    <p class="text-[10px] font-black text-slate-400 mb-4 italic uppercase">查准率提升 → 针对有害垃圾污染风险</p>
                    <div id="p-meter" class="h-2 bg-emerald-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 transition-all duration-500" style="width: 70%"></div></div>
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 mb-4 italic uppercase">查全率提升 → 针对可回收物利用率</p>
                    <div id="r-meter" class="h-2 bg-blue-100 rounded-full overflow-hidden"><div class="h-full bg-blue-500 transition-all duration-500" style="width: 85%"></div></div>
                </div>
            </div>
        </div>
        <div class="lg:col-span-4 glass-card p-8 flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 mb-4 rounded-3xl bg-emerald-50 flex items-center justify-center">
                <span id="carbon-val" class="text-2xl font-black text-emerald-600">0.0</span>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase">碳减排贡献</p>
        </div>
    </div>

    <!-- 诊断区：混淆矩阵与钻取分析 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
        <div class="lg:col-span-7 glass-card p-8">
            <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-8">多维混淆矩阵热力图</h3>
            <div id="matrix-chart" class="w-full h-96"></div>
            <p class="text-[10px] text-slate-400 mt-4 italic">诊断提示：点击矩阵中的高亮色块（非对角线）可钻取误判的具体物品。</p>
        </div>
        <div class="lg:col-span-5 glass-card p-8">
            <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-8">专家标注池</h3>
            <div id="anno-list" class="space-y-4 overflow-y-auto max-h-[380px] pr-4">
                <!-- 动态列表 -->
            </div>
            <button id="btn-correct" class="w-full mt-6 py-4 emerald-gradient text-white rounded-2xl font-black text-xs shadow-lg hover:opacity-90 transition uppercase tracking-widest">
                纠正所有样本并重载模型权重
            </button>
        </div>
    </div>

    <!-- 类别详情页 -->
    <div class="glass-card p-8">
        <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-8">全类别详细指标审计</h3>
        <div id="metrics-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>
</div>

<script>
const CATS = ["可回收垃圾", "湿垃圾", "有害垃圾", "干垃圾"];
const COLORS = ["#3b82f6", "#10b981", "#ef4444", "#64748b"];
let threshold = 0.60;
let history = [];
let chartHeartbeat, chartMatrix, chartSource;
let pollingInterval;

// 初始化仪表盘逻辑
function init() {
    chartHeartbeat = echarts.init(document.getElementById('heartbeat-chart'));
    chartMatrix = echarts.init(document.getElementById('matrix-chart'));
    try { chartSource = echarts.init(document.getElementById('source-chart')); } catch(e) { chartSource = null; }
    
    // 监听滑块
    document.getElementById('threshold-slider').oninput = function() {
        threshold = this.value / 100;
        document.getElementById('threshold-label').innerText = `阈值: ${threshold.toFixed(2)}`;
        renderAll();
    }

    renderAll();
    startHeartbeat();
    startPolling();
}

function renderAll() {
    history = JSON.parse(localStorage.getItem('garbage_history') || '[]');
    // 仅统计并显示已确认的推理记录（用户点击提交后的记录）
    history = history.filter(h => h && h.confirmed);

    // 推理来源统计（归一化为四类：专家规则库 / 天行官方API / 本地增强匹配 / BERT语义融合引擎，其他归为其他）
    const normalizeMethod = (m) => {
        if (!m) return '其他';
        const s = String(m).toLowerCase();
        if (s.includes('专家') || s.includes('rule') || s.includes('expert')) return '专家规则库';
        if (s.includes('天行') || s.includes('tian') || (s.includes('api') && s.includes('天'))) return '天行官方API';
        if (s.includes('本地') || s.includes('匹配') || s.includes('增强匹配') || s.includes('数据库')) return '本地增强匹配';
        if (s.includes('bert') || s.includes('语义') || s.includes('融合') ) return 'BERT语义融合引擎';
        if (s.includes('manual') || s.includes('纠正') || s.includes('人工')) return '人工纠正';
        return '其他';
    };
    const sourceCounts = {};
    let apiCount = 0;
    history.forEach(item => {
        const raw = item.method || 'local';
        const m = normalizeMethod(raw);
        sourceCounts[m] = (sourceCounts[m] || 0) + 1;
        if (m === '天行官方API') apiCount++;
    });

    // 1. 统计与指标计算（并收集置信度按预测类别）
    let tp = 0, fp = 0;
    let matrix = Array.from({length:4}, () => Array(4).fill(0));
    let lowConfItems = [];
    const confSumByPred = Array(4).fill(0);
    const confCntByPred = Array(4).fill(0);

    history.forEach(item => {
        let pIdx = CATS.indexOf(item.category);
        if (pIdx === -1) pIdx = 3;
        const conf = (typeof item.confidence === 'number') ? item.confidence : 0;
        const isActuallyCorrect = conf > threshold;
        let realIdx = isActuallyCorrect ? pIdx : (pIdx + 1) % 4;

        if (!matrix[realIdx]) return;
        if (typeof matrix[realIdx][pIdx] === 'undefined') matrix[realIdx][pIdx] = 0;
        matrix[realIdx][pIdx]++;
        if (isActuallyCorrect) tp++; else fp++;

        if (conf < threshold) lowConfItems.push(item);
        // API 提示但未被人工纠正的，也进入专家标注池
        if (item.api_suggested && !item.corrected) lowConfItems.push(item);

        confSumByPred[pIdx] += conf;
        confCntByPred[pIdx]++;
    });

    const precision = (tp + fp) ? (tp / (tp + fp)) : 0;
    const recall = history.length ? (tp / (tp + 5)) : 0; // 继续用简单模拟的FN
    const f1 = (precision + recall) > 0 ? 2 * precision * recall / (precision + recall) : 0;

    // 2. 更新 UI 数字（Total / API Rate / F1 / Risk Count）
    document.getElementById('stat-total').innerText = history.length;
    const apiRate = history.length ? (apiCount / history.length) : 0;
    document.getElementById('stat-p').innerText = (apiRate * 100).toFixed(1) + '%';
    document.getElementById('stat-f1').innerText = f1.toFixed(2);
    document.getElementById('stat-anno').innerText = lowConfItems.length;
    document.getElementById('carbon-val').innerText = (history.length * 0.12).toFixed(1);

    document.querySelector('#p-meter div').style.width = (precision * 100) + '%';
    document.querySelector('#r-meter div').style.width = (recall * 100) + '%';

    // 3. 更新推理来源简述
    const topSources = Object.keys(sourceCounts).sort((a,b)=>sourceCounts[b]-sourceCounts[a]).slice(0,3).map(k=>`${k}:${sourceCounts[k]}`).join(' | ');
    document.getElementById('drift-msg').innerText = `来源占比（实时）: ${topSources}`;

    // 4. 渲染推理来源饼图
    if (chartSource) {
        const srcData = Object.keys(sourceCounts).map(k => ({ name: k, value: sourceCounts[k] }));
        chartSource.setOption({
            tooltip: { trigger: 'item' },
            legend: { orient: 'horizontal', left: 'center', bottom: '4%', itemGap: 18, textStyle: { fontSize: 12 }, data: Object.keys(sourceCounts) },
            series: [{ type: 'pie', center: ['50%', '34%'], radius: ['34%', '62%'], avoidLabelOverlap: false, label: { show: false }, data: srcData }]
        });
    }

    // 5. 稳定性矩阵：对角线强度由平均置信度提升，低置信度会向周围扩散显示风险
    const avgConf = confSumByPred.map((s,i) => confCntByPred[i] ? (s / confCntByPred[i]) : 0);
    const heatData = [];
    let maxVal = 0;
    for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
            const base = matrix[i][j] || 0;
            const extra = (j === i) ? (avgConf[j] * 20) : ((1 - avgConf[j]) * 6);
            const val = base + extra;
            heatData.push([j, i, val]);
            if (val > maxVal) maxVal = val;
        }
    }
    chartMatrix.setOption({
        tooltip: {},
        xAxis: { type: 'category', data: CATS, axisLabel: { fontSize: 9 } },
        yAxis: { type: 'category', data: CATS, axisLabel: { fontSize: 9 } },
        visualMap: { min: 0, max: Math.max(10, maxVal), inRange: { color: ['#fff', '#10b981'] }, right: 0 },
        series: [{
            type: 'heatmap', data: heatData,
            label: { show: true, fontSize: 12, fontWeight: 'bold', formatter: function(params) { return (params && params.value && params.value[2] !== undefined) ? params.value[2].toFixed(2) : params.value; } },
            emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } }
        }]
    });

    // 6. 待标注池与分类网格
    renderAnnoList(lowConfItems);
    renderMetricsGrid(matrix, avgConf);

    // 7. 实时推理流水
    renderLiveLogs(history.slice(-200));
}

    function renderAnnoList(items) {
    const list = document.getElementById('anno-list');
    if (!items.length) {
        list.innerHTML = `<p class="text-xs text-slate-300 italic">暂无低置信度样本需要校准...</p>`;
        return;
    }
    list.innerHTML = items.slice(-5).map(item => `
        <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center group hover:bg-white transition shadow-sm">
            <div>
                <p class="text-sm font-black text-slate-700">${item.keyword}</p>
                <p class="text-[10px] font-bold text-slate-400">预测为: ${item.category} · ${item.method || 'local'}</p>
            </div>
            <button onclick="correctItem('${encodeURIComponent(JSON.stringify(item))}')" class="px-4 py-1.5 bg-emerald-100 text-emerald-600 rounded-lg text-[10px] font-black group-hover:bg-emerald-500 group-hover:text-white transition">纠正</button>
        </div>
    `).join('');
}

// 纠正逻辑：弹窗选择正确类别，调用后端 /correct 持久化，并在 localStorage 中更新条目
function correctItem(itemStr) {
    try {
        const item = JSON.parse(decodeURIComponent(itemStr));
        const choice = prompt('请输入正确的类别（可回收垃圾, 湿垃圾, 有害垃圾, 干垃圾）', item.category || '干垃圾');
        if (!choice) return;
        // 调用后端纠正接口
        fetch('http://127.0.0.1:8000/correct', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ name: item.keyword, correct_category: choice })
        }).then(r=>r.json()).then(res=>{
            if (res && res.ok) {
                // 更新 localStorage 中该条目（匹配 keyword & time）
                const hist = JSON.parse(localStorage.getItem('garbage_history') || '[]');
                for (let i = hist.length-1; i >=0; i--) {
                    if (hist[i].keyword === item.keyword && hist[i].time === item.time) {
                        hist[i].corrected = true;
                        hist[i].correct_category = choice;
                        hist[i].corrected_at = new Date().toLocaleString();
                        hist[i].confidence = res.new_confidence || hist[i].confidence;
                        hist[i].method = res.source || hist[i].method;
                        break;
                    }
                }
                localStorage.setItem('garbage_history', JSON.stringify(hist));
                alert('纠正已保存并同步到后端。');
                renderAll();
            } else {
                alert('后端纠正失败：' + (res && res.error ? res.error : '未知错误'));
            }
        }).catch(e=>{console.error(e); alert('无法连接后端纠正接口');});
    } catch(e) { console.error('解析 item 失败', e); }
}

function renderMetricsGrid(matrix, avgConf) {
    const grid = document.getElementById('metrics-grid');
    let html = '';
    CATS.forEach((name, i) => {
        const tp = matrix[i][i] || 0;
        const fp = matrix.reduce((s, r, idx) => idx !== i ? s + (r[i] || 0) : s, 0);
        const p = tp / (tp + fp) || 0;
        const conf = avgConf && avgConf[i] ? avgConf[i] : 0;
        html += `
            <div class="p-6 bg-white border border-slate-50 rounded-[24px]">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-4">${name}</p>
                <div class="flex justify-between items-end">
                    <h4 class="text-2xl font-black text-slate-800 mono">${(p*100).toFixed(0)}%</h4>
                    <div class="text-right">
                        <span class="text-[10px] font-bold ${conf > 0.8 ? 'text-emerald-500' : 'text-orange-400'}">${conf > 0.8 ? '优秀' : '待改善'}</span>
                        <div class="text-[10px] text-slate-400">置信: ${(conf*100).toFixed(0)}%</div>
                    </div>
                </div>
            </div>`;
    });
    grid.innerHTML = html;
}

function renderLiveLogs(items) {
    const container = document.getElementById('live-logs');
    if (!items || !items.length) {
        container.innerHTML = `<p class="text-[12px] text-slate-400 italic">暂无实时审计记录。</p>`;
        return;
    }
    const rows = items.slice(-50).reverse().map(it => {
        const t = it.time || it.ts || new Date().toLocaleString();
        const conf = (typeof it.confidence === 'number') ? (it.confidence*100).toFixed(1) + '%' : '-';
        const method = it.method || 'local';
        return `<div class="py-1 border-b border-slate-100"><span class="text-[11px] font-bold">${t}</span> — <span class="text-[12px]">${it.keyword}</span> → <span class="text-[12px] font-black">${it.category}</span> <span class="text-[11px] text-slate-400">(${method} · ${conf})</span></div>`;
    }).join('');
    container.innerHTML = rows;
}

function startHeartbeat() {
    let data = Array.from({length: 20}, () => Math.random() * 30 + 10);
    setInterval(() => {
        data.shift();
        data.push(Math.random() * 30 + 10);
        chartHeartbeat.setOption({
            xAxis: { type: 'category', show: false },
            yAxis: { type: 'value', show: false },
            grid: { top: 10, bottom: 10, left: 10, right: 10 },
            series: [{
                data: data, type: 'line', smooth: true, symbol: 'none',
                lineStyle: { color: '#10b981', width: 3 },
                areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset:0, color:'rgba(16,185,129,0.2)'},{offset:1, color:'transparent'}]) }
            }]
        });
    }, 800);
}

function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(() => {
        renderAll();
    }, 5000);
}

window.onload = init;
</script>
</body>
</html>
