<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈学习中心 - 垃圾图片分类系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16A34A;
            --primary-light: #22C55E;
            --primary-lighter: #86EFAC;
            --primary-dark: #15803D;
            --primary-darker: #166534;
            --accent: #0891B2;
            --accent-light: #22D3EE;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
            --bg-main: #F0FDF4;
            --bg-card: #FFFFFF;
            --bg-hover: #DCFCE7;
            --bg-muted: #ECFDF5;
            --text-primary: #14532D;
            --text-secondary: #166534;
            --text-muted: #6B7280;
            --border: #D1FAE5;
            --border-light: #BBF7D0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: 200ms ease;
            --transition-slow: 300ms ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-primary);
        }
        
        .navbar {
            background: white;
            padding: 12px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #2E7D32;
            font-weight: 700;
        }
        
        .navbar-brand span {
            font-size: 24px;
            transition: transform 0.3s ease;
        }
        
        .navbar-brand:hover span {
            transform: rotate(5deg) scale(1.1);
        }
        
        .navbar-menu {
            list-style: none;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0;
            padding: 0;
        }
        
        .navbar-menu li a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }
        
        .navbar-menu li a:hover {
            background: #f0f7f0;
            color: #2E7D32;
            transform: translateY(-1px);
        }
        
        .navbar-menu li .logout-btn {
            color: #dc3545;
        }
        
        .navbar-menu li .logout-btn:hover {
            background: #f8d7da;
        }
        
        .main-content {
            padding: 32px 0;
            min-height: calc(100vh - 60px);
        }
        
        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .page-header {
            margin-bottom: 24px;
            animation: fadeInDown 0.4s ease-out;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .page-header-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .page-header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        .page-header-text h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .page-header-text p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 1024px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 640px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            cursor: pointer;
        }
        
        .stat-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .stat-card .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }
        
        .stat-card .stat-icon.green {
            background: var(--bg-hover);
            color: var(--primary);
        }
        
        .stat-card .stat-icon.yellow {
            background: #FEF3C7;
            color: var(--warning);
        }
        
        .stat-card .stat-icon.blue {
            background: #DBEAFE;
            color: var(--info);
        }
        
        .stat-card .stat-icon.red {
            background: #FEE2E2;
            color: var(--danger);
        }
        
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-muted);
            border-bottom: 1px solid var(--border);
        }
        
        .card-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-header h2 span {
            font-size: 18px;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .filter-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .filter-group {
            flex: 1;
            min-width: 180px;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
        }
        
        select, input, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg-card);
            transition: all var(--transition);
            font-family: inherit;
            color: var(--text-primary);
        }
        
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }
        
        select:hover, input:hover {
            border-color: var(--primary-lighter);
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
        }
        
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .table-container {
            max-height: 520px;
            overflow-y: auto;
            border-radius: var(--radius-sm);
        }
        
        .table-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-muted);
            border-radius: 3px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: var(--primary-lighter);
            border-radius: 3px;
        }
        
        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 13px;
        }
        
        th {
            background: var(--bg-muted);
            font-weight: 600;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        
        td {
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }
        
        tr.feedback-item {
            cursor: pointer;
            transition: background var(--transition);
        }
        
        tr.feedback-item:hover td {
            background: var(--bg-hover);
        }
        
        tr.feedback-item.selected td {
            background: var(--bg-hover);
            box-shadow: inset 3px 0 0 var(--primary);
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .status-pending {
            background: #FEF3C7;
            color: #B45309;
        }
        
        .status-processed {
            background: var(--bg-hover);
            color: var(--primary-dark);
        }
        
        .status-ignored {
            background: #F3F4F6;
            color: #6B7280;
        }
        
        .detail-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .detail-image {
            text-align: center;
            padding: 20px;
            background: var(--bg-muted);
            border-radius: var(--radius);
        }
        
        .detail-image img {
            max-width: 200px;
            max-height: 200px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            object-fit: cover;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .detail-item {
            padding: 14px;
            background: var(--bg-muted);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        
        .detail-item label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-item span {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .detail-item .wrong {
            color: var(--danger);
        }
        
        .detail-item .correct {
            color: var(--primary);
        }
        
        .detail-note {
            padding: 16px;
            background: var(--bg-muted);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
        }
        
        .detail-note label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .detail-note p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }
        
        .btn-secondary {
            background: #F3F4F6;
            color: var(--text-secondary);
            flex: 1;
        }
        
        .btn-secondary:hover {
            background: #E5E7EB;
            transform: translateY(-1px);
        }
        
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        
        .btn-warning:hover {
            background: #D97706;
            transform: translateY(-1px);
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .undo-button-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            padding-right: 20px;
        }
        
        .btn-undo {
            padding: 14px 32px;
            font-size: 15px;
            min-width: 160px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        
        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-state p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .table-actions {
            display: flex;
            gap: 6px;
        }
        
        .table-actions .btn {
            padding: 4px 8px;
            font-size: 11px;
            flex: none;
        }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            border-radius: var(--radius);
            color: white;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            animation: slideInUp 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toast.success {
            background: var(--primary);
        }
        
        .toast.error {
            background: var(--danger);
        }
        
        .toast.warning {
            background: var(--warning);
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .content-container {
                padding: 0 16px;
            }
            
            .page-header-text h1 {
                font-size: 20px;
            }
            
            .filter-row {
                flex-direction: column;
            }
            
            .filter-group {
                min-width: 100%;
            }
            
            .detail-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .navbar-menu {
                gap: 2px;
            }
            
            .navbar-menu li a {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <a href="{{ url_for('auth.admin_dashboard') }}" class="navbar-brand">
            <span>🗑️</span>
            <span>垃圾图片分类系统</span>
        </a>
        <ul class="navbar-menu">
            <li>
                <a href="{{ url_for('auth.admin_dashboard') }}">
                    <span>🏠</span> 管理首页
                </a>
            </li>
            <li>
                <a href="{{ url_for('auth.user_management') }}">
                    <span>👥</span> 用户管理
                </a>
            </li>
            <li>
                <a href="{{ url_for('auth.feedback') }}">
                    <span>📝</span> 反馈学习
                </a>
            </li>
            <li>
                <a href="{{ url_for('auth.admin_analytics') }}">
                    <span>📊</span> 数据统计
                </a>
            </li>
            <li>
                <a href="{{ url_for('auth.logout') }}" class="logout-btn">
                    <span>🚪</span> 退出
                </a>
            </li>
        </ul>
    </div>
</nav>

<div class="main-content">
    <div class="content-container">
        <div class="page-header">
            <div class="page-header-content">
                <div class="page-header-icon">📝</div>
                <div class="page-header-text">
                    <h1>反馈学习中心</h1>
                    <p>管理用户反馈，优化模型性能</p>
                </div>
            </div>
        </div>
        
        <div class="stats-row">
            <div class="stat-card" onclick="filterByStatus('all')">
                <div class="stat-icon green">📊</div>
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">总反馈数</div>
            </div>
            <div class="stat-card" onclick="filterByStatus('pending')">
                <div class="stat-icon yellow">⏳</div>
                <div class="stat-value" id="stat-pending">0</div>
                <div class="stat-label">待处理</div>
            </div>
            <div class="stat-card" onclick="filterByStatus('processed')">
                <div class="stat-icon blue">✅</div>
                <div class="stat-value" id="stat-processed">0</div>
                <div class="stat-label">已处理</div>
            </div>
            <div class="stat-card" onclick="filterByStatus('ignored')">
                <div class="stat-icon red">🚫</div>
                <div class="stat-value" id="stat-ignored">0</div>
                <div class="stat-label">已忽略</div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <h2><span>🔍</span> 反馈筛选</h2>
            </div>
            <div class="card-body">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>处理状态</label>
                        <select id="feedback-status" onchange="filterFeedback()">
                            <option value="all">全部状态</option>
                            <option value="pending">待处理</option>
                            <option value="processed">已处理</option>
                            <option value="ignored">已忽略</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>垃圾分类</label>
                        <select id="feedback-category" onchange="filterFeedback()">
                            <option value="all">全部分类</option>
                            <option value="可回收物">可回收物</option>
                            <option value="厨余垃圾">厨余垃圾</option>
                            <option value="有害垃圾">有害垃圾</option>
                            <option value="其他垃圾">其他垃圾</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <h2><span>📋</span> 反馈列表</h2>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户</th>
                                    <th>时间</th>
                                    <th>垃圾名称</th>
                                    <th>错误分类</th>
                                    <th>正确分类</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8">
                                        <div class="loading-state">
                                            <div class="loading-spinner"></div>
                                            <p>加载中...</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2><span>🔍</span> 反馈详情</h2>
                </div>
                <div class="card-body">
                    <div id="feedback-details">
                        <div class="empty-state">
                            <div class="emoji">📝</div>
                            <p>点击左侧列表查看反馈详情</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let selectedFeedbackId = null;
let allFeedbackData = [];

window.addEventListener('DOMContentLoaded', function() {
    loadFeedbackList();
});

function loadFeedbackList() {
    fetch('/api/feedback/list')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                allFeedbackData = data.data;
                updateStats(data.data);
                filterFeedback();
            } else {
                console.error('获取反馈列表失败：' + data.message);
            }
        })
        .catch(error => {
            console.error('获取反馈列表失败:', error);
        });
}

function updateStats(feedbackList) {
    const total = feedbackList.length;
    const pending = feedbackList.filter(f => f.status === 'pending').length;
    const processed = feedbackList.filter(f => f.status === 'processed').length;
    const ignored = feedbackList.filter(f => f.status === 'ignored').length;
    
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-processed').textContent = processed;
    document.getElementById('stat-ignored').textContent = ignored;
}

function filterByStatus(status) {
    document.getElementById('feedback-status').value = status;
    filterFeedback();
}

function updateFeedbackList(feedbackList) {
    const tableBody = document.querySelector('table tbody');
    tableBody.innerHTML = '';
    
    if (feedbackList.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td colspan="8">
                <div class="empty-state">
                    <div class="emoji">📭</div>
                    <p>暂无反馈数据</p>
                </div>
            </td>
        `;
        tableBody.appendChild(row);
    } else {
        feedbackList.forEach(feedback => {
            const row = document.createElement('tr');
            row.className = 'feedback-item';
            if (selectedFeedbackId === feedback.id) {
                row.classList.add('selected');
            }
            row.onclick = (e) => showFeedbackDetails(feedback.id, e);
            
            row.innerHTML = `
                <td>#${feedback.id}</td>
                <td>${feedback.user}</td>
                <td>${feedback.time}</td>
                <td>${feedback.garbageName}</td>
                <td><span style="color: var(--danger); font-weight: 500;">${feedback.wrongCategory}</span></td>
                <td><span style="color: var(--primary); font-weight: 500;">${feedback.correctCategory}</span></td>
                <td>${getStatusLabel(feedback.status)}</td>
                <td>
                    <div class="table-actions">
                        ${feedback.status === 'pending' ? `
                            <button class="btn btn-primary btn-small" onclick="event.stopPropagation(); processFeedback(${feedback.id})">处理</button>
                            <button class="btn btn-secondary btn-small" onclick="event.stopPropagation(); ignoreFeedback(${feedback.id})">忽略</button>
                        ` : `
                            <button class="btn btn-warning btn-small" onclick="event.stopPropagation(); undoFeedback(${feedback.id})">撤回</button>
                        `}
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }
}

function getStatusLabel(status) {
    const statusMap = {
        'pending': '<span class="status-badge status-pending">待处理</span>',
        'processed': '<span class="status-badge status-processed">已处理</span>',
        'ignored': '<span class="status-badge status-ignored">已忽略</span>'
    };
    return statusMap[status] || status;
}

function filterFeedback() {
    const status = document.getElementById('feedback-status').value;
    const category = document.getElementById('feedback-category').value;
    
    let filtered = allFeedbackData;
    
    if (status !== 'all') {
        filtered = filtered.filter(f => f.status === status);
    }
    
    if (category !== 'all') {
        filtered = filtered.filter(f => f.correctCategory === category);
    }
    
    updateFeedbackList(filtered);
}

function showFeedbackDetails(feedbackId, clickEvent) {
    selectedFeedbackId = feedbackId;
    
    document.querySelectorAll('.feedback-item').forEach(row => {
        row.classList.remove('selected');
    });
    
    if (clickEvent && clickEvent.currentTarget) {
        clickEvent.currentTarget.classList.add('selected');
    } else {
        const rows = document.querySelectorAll('.feedback-item');
        rows.forEach(row => {
            if (row.innerHTML.includes(`#${feedbackId}</td>`)) {
                row.classList.add('selected');
            }
        });
    }
    
    fetch(`/api/feedback/details/${feedbackId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderFeedbackDetails(data.data);
            } else {
                showToast('获取详情失败：' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('获取反馈详情失败:', error);
            showToast('获取详情失败', 'error');
        });
}

function renderFeedbackDetails(feedback) {
    const detailsContainer = document.getElementById('feedback-details');
    
    detailsContainer.innerHTML = `
        <div class="detail-section">
            <div class="detail-image">
                <img src="${feedback.image || '/static/images/placeholder.png'}" alt="垃圾图片">
            </div>
            
            <div class="detail-grid">
                <div class="detail-item">
                    <label>反馈ID</label>
                    <span>#${feedback.id}</span>
                </div>
                <div class="detail-item">
                    <label>提交用户</label>
                    <span>${feedback.user}</span>
                </div>
                <div class="detail-item">
                    <label>垃圾名称</label>
                    <span>${feedback.garbageName}</span>
                </div>
                <div class="detail-item">
                    <label>提交时间</label>
                    <span>${feedback.time}</span>
                </div>
                <div class="detail-item">
                    <label>错误分类</label>
                    <span class="wrong">${feedback.wrongCategory}</span>
                </div>
                <div class="detail-item">
                    <label>正确分类</label>
                    <span class="correct">${feedback.correctCategory}</span>
                </div>
            </div>
            
            ${feedback.note ? `
            <div class="detail-note">
                <label>用户备注</label>
                <p>${feedback.note}</p>
            </div>
            ` : ''}
            
            <div class="action-buttons">
                ${feedback.status === 'pending' ? `
                    <button class="btn btn-primary" onclick="processFeedback(${feedback.id})">
                        ✓ 处理反馈
                    </button>
                    <button class="btn btn-secondary" onclick="ignoreFeedback(${feedback.id})">
                        ✕ 忽略
                    </button>
                ` : `
                    <div class="undo-button-wrapper">
                        <button class="btn btn-warning btn-undo" onclick="undoFeedback(${feedback.id})">
                            ↩ 撤回标记
                        </button>
                    </div>
                `}
            </div>
        </div>
    `;
}

function processFeedback(feedbackId) {
    fetch(`/api/feedback/process/${feedbackId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'status=processed'
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('反馈已处理', 'success');
                loadFeedbackList();
                if (selectedFeedbackId === feedbackId) {
                    showFeedbackDetails(feedbackId);
                }
            } else {
                showToast('处理失败：' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('处理反馈失败:', error);
            showToast('处理失败', 'error');
        });
}

function ignoreFeedback(feedbackId) {
    fetch(`/api/feedback/process/${feedbackId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'status=ignored'
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('反馈已忽略', 'warning');
                loadFeedbackList();
                if (selectedFeedbackId === feedbackId) {
                    showFeedbackDetails(feedbackId);
                }
            } else {
                showToast('操作失败：' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('忽略反馈失败:', error);
            showToast('操作失败', 'error');
        });
}

function undoFeedback(feedbackId) {
    fetch(`/api/feedback/undo/${feedbackId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        }
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('已撤回标记', 'success');
                loadFeedbackList();
                if (selectedFeedbackId === feedbackId) {
                    showFeedbackDetails(feedbackId);
                }
            } else {
                showToast('撤回失败：' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('撤回反馈失败:', error);
            showToast('撤回失败', 'error');
        });
}

function showToast(message, type) {
    const existingToast = document.querySelector('.toast');
    if (existingToast) {
        existingToast.remove();
    }
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
</script>
</body>
</html>
