    <style>
        body { background-color: #f0fdf4; font-family: 'Inter', 'PingFang SC', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid #dcfce7; border-radius: 32px; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .chat-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(16,185,129,0.3);

            0% { transform: translateY(0) rotate(-2deg); }

            height: 600px;
            max-height: 70vh;

        .chat-header {

        .chat-close {

            align-items: center;

            cursor: pointer;
            font-weight: 700;
        }
        .chat-close:hover { background: rgba(255,255,255,0.18); }
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f9fdfb;
        }
        .chat-input {
            border-top: 1px solid #eee;
            padding: 12px;
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px 14px;
            outline: none;
        }
        .chat-input button {
            background: #10b981;
            color: white;
            border-radius: 16px;
            padding: 0 16px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* 录音时的呼吸灯效果 */
.voice-active {
    background: #ef4444 !important; /* 变成红色 */
    color: white !important;
    animation: voice-pulse 1.5s infinite;
}

@keyframes voice-pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); transform: translateY(-50%) scale(1); }
    70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); transform: translateY(-50%) scale(1.1); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: translateY(-50%) scale(1); }
}

        .msg-bot {
            background: #e2f7eF;
            color: #065f46;
            padding: 10px 14px;
            border-radius: 18px 18px 18px 4px;
            margin-bottom: 10px;
            max-width: 80%;
            font-size: 14px;
            width: fit-content;
        }
        .msg-user {
            background: #10b981;

            padding: 10px 14px;

            margin-bottom: 10px;
            max-width: 80%;
            font-size: 14px;

        /* 语音麦克风按钮样式 */
        .voice-btn {
            position: absolute;
            right: 140px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;

            border-radius: 50%;
            background: #10b981;

            transition: all 0.3s;

        }
        .voice-active {

        }
        @keyframes voice-pulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
            70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); }

<script>
const categoryMap = {
    "可回收垃圾": { color: "#3b82f6", icon: "♻️", tip: "适宜回收利用，可循环加工再利用" },
    "有害垃圾": { color: "#ef4444", icon: "⚠️", tip: "含有毒有害物质，需特殊安全处理" },
    "湿垃圾": { color: "#10b981", icon: "🍎", tip: "易腐烂的生物质生活废弃物" },
    "干垃圾": { color: "#64748b", icon: "🗑️", tip: "除以上几类外的其他生活废弃物" },
    "大件垃圾": { color: "#8b5cf6", icon: "🪑", tip: "体积较大、需要拆分处理的废弃物品" }
};

let chart;
let recognition = null;
let isListening = false;

window.onload = () => {
    initChart();
    initVoiceRecognition();
    
    const inputEl = document.getElementById('ai-input');
    const inferBtn = document.getElementById('btn-infer');
    
    inferBtn.onclick = () => {
        const val = inputEl.value.trim();
        if (!val) return;
        infer(val).then(res => {
            try {
                const hist = JSON.parse(localStorage.getItem('garbage_history') || '[]');
                const entry = {
                    keyword: val,
                    category: res.category || '干垃圾',
                    confidence: typeof res.confidence === 'number' ? res.confidence : (typeof res.confidence === 'string' ? parseFloat(res.confidence) : 0),
                    method: res.method || 'unknown',
                    time: new Date().toLocaleString(),
                    confirmed: true,
                    bert_conf: res.bert_conf || null,
                    vec_conf: res.vec_conf || null,
                    final_conf: res.confidence || null,
                    api_suggested: res.api_suggested || false,
                    suggested_name: res.suggested_name || null,
                    corrected: false,
                    needs_review: !!res.api_suggested
                };
                hist.push(entry);
                localStorage.setItem('garbage_history', JSON.stringify(hist));
            } catch(e) { console.error('保存 history 失败', e); }
        }).catch(()=>{});
    };
};

// ===================== 语音识别功能（STT）=====================
function initVoiceRecognition() {
    const voiceBtn = document.getElementById('voiceBtn');
    const inputEl = document.getElementById('ai-input');
    
    // 检查浏览器是否支持
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        voiceBtn.style.display = 'none';
        console.error("浏览器不支持语音识别");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false; // 录完一段自动停止
    recognition.interimResults = false;

    // 开始录音
    recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('voice-active');
        voiceBtn.innerText = '🛑'; 
        inputEl.placeholder = "正在倾听，请说话...";
    };

    // 录音结束并获得文字
    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        inputEl.value = text;
        // 自动触发识别逻辑
        document.getElementById('btn-infer').click();
    };

    // 录音自然结束或手动停止
    recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove('voice-active');
        voiceBtn.innerText = '🎤';
        inputEl.placeholder = "输入垃圾名称（如：头发、电池、化妆品）";
    };

    recognition.onerror = (e) => {
        console.error('语音识别错误', e);
        isListening = false;
        voiceBtn.classList.remove('voice-active');
        voiceBtn.innerText = '🎤';
    };

    // 绑定点击事件
    voiceBtn.onclick = (e) => {
        e.preventDefault();
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    };
}

function startListening() {
    isListening = true;
    const voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.classList.add('voice-active');
    voiceBtn.innerText = '🛑';
    recognition.start();
    document.getElementById('status-text').innerText = '正在听你说话...';
}

function stopListening() {
    isListening = false;
    const voiceBtn = document.getElementById('voiceBtn');
    voiceBtn.classList.remove('voice-active');
    voiceBtn.innerText = '🎤';
    recognition.stop();
    document.getElementById('status-text').innerText = '引擎在线';
}

// ===================== 可解释性 AI（XAI）决策证据链 =====================
function generateDecisionEvidence(text, tokens, norms, category) {
    if (!tokens || tokens.length === 0) return '';

    let maxWeight = 0;
    let keyWord = '';
    let keyReason = '';

    for (let i = 0; i < tokens.length; i++) {
        const w = norms[i] || 0;
        if (w > maxWeight) {
            maxWeight = w;
            keyWord = tokens[i];
        }
    }

    if (category === '干垃圾' && (keyWord.includes('油污') || keyWord.includes('污染') || keyWord.includes('脏'))) {
        keyReason = `系统检测到 <span class="highlight-key">${keyWord}</span> 为关键负向特征，权重 ${maxWeight.toFixed(2)}，因此判定为干垃圾`;
    } else if (category === '有害垃圾' && (keyWord.includes('电池') || keyWord.includes('药品') || keyWord.includes('化学'))) {
        keyReason = `系统检测到 <span class="highlight-key">${keyWord}</span> 为有毒特征，权重 ${maxWeight.toFixed(2)}，因此判定为有害垃圾`;
    } else if (category === '湿垃圾' && (keyWord.includes('食物') || keyWord.includes('果皮') || keyWord.includes('剩菜'))) {
        keyReason = `系统检测到 <span class="highlight-key">${keyWord}</span> 为易腐特征，权重 ${maxWeight.toFixed(2)}，因此判定为湿垃圾`;
    } else if (category === '可回收垃圾') {
        keyReason = `系统检测到 <span class="highlight-key">${keyWord}</span> 为可循环特征，权重 ${maxWeight.toFixed(2)}，因此判定为可回收垃圾`;
    } else {
        keyReason = `系统依据 <span class="highlight-key">${keyWord}</span>（权重 ${maxWeight.toFixed(2)}）完成分类决策`;
    }

    return `决策证据链：${keyReason}，符合垃圾分类国家标准。`;
}

// ===================== 核心推理函数 =====================
async function infer(val) {
    if(!val) return;
    const startTime = Date.now();
    
    try {
        const response = await fetch('http://127.0.0.1:8000/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: val})
        });
        const data = await response.json();

        if (!response.ok) {
            console.error('后端响应错误', data);
            document.getElementById('status-text').innerText = '后端错误';
            return;
        }

        const category = data.category || '干垃圾';
        const info = categoryMap[category] || categoryMap['干垃圾'];
        updateUI(info, category, data.confidence || 0, data.guide || null, data.matched_sample || null, data.tokens || [], data.token_norms || [], val);
        document.getElementById('latency-val').innerText = (Date.now() - startTime) + "ms";
        return data;
    } catch (e) {
    console.error("后端未连接", e);
    document.getElementById('status-text').innerText = "后端未连接";
    return { category: '干垃圾', confidence: 0, method: 'offline-fallback', guide: null };
}
}

function updateUI(info, category, conf, guide, matched_sample, tokens = [], token_norms = [], inputText = '') {
    const box = document.getElementById('result-box');
    box.classList.remove('hidden');
    setTimeout(() => box.classList.replace('opacity-0', 'opacity-100'), 50);

    document.getElementById('res-icon').style.backgroundColor = info.color;
    document.getElementById('res-icon').innerText = info.icon;
    
    document.getElementById('res-name').innerText = category;
    document.getElementById('res-name').style.color = info.color;
    document.getElementById('conf-val').innerText = (conf*100).toFixed(1) + '%';
    document.getElementById('conf-bar').style.width = (conf*100) + '%';
    document.getElementById('conf-bar').style.backgroundColor = info.color;
    const guideEl = document.getElementById('res-guide');
    if (guide) {
        guideEl.innerText = guide;
    } else if (matched_sample) {
        guideEl.innerText = `参考样本「${matched_sample}」的投放建议：` + info.tip;
    } else {
        guideEl.innerText = info.tip;
    }

    // 可视化注意力权重
    const tokenViz = document.getElementById('token-viz');
    tokenViz.innerHTML = '';
    if (tokens && tokens.length) {
        const maxNorm = token_norms && token_norms.length ? Math.max(...token_norms) : 1;
        tokens.forEach((t, i) => {
            const norm = (token_norms && token_norms[i]) ? token_norms[i] : 0;
            const intensity = Math.min(1, maxNorm ? (norm / maxNorm) : 0);
            const bg = `rgba(16,185,129,${0.12 + 0.6*intensity})`;
            const el = document.createElement('span');
            el.className = 'px-2 py-1 rounded-md text-[12px] border border-slate-100';
            el.style.background = bg;
            el.style.color = '#064e3b';
            el.innerText = `${t} (${norm.toFixed(2)})`;
            tokenViz.appendChild(el);
        });
    } else {
        tokenViz.innerHTML = '<span class="text-xs text-slate-400 italic">无 token 信息</span>';
    }

    // 显示决策证据链
    const evidenceEl = document.getElementById('decision-evidence');
    const evidenceHtml = generateDecisionEvidence(inputText, tokens, token_norms, category);
    evidenceEl.innerHTML = evidenceHtml;
    evidenceEl.classList.remove('hidden');
}

const chatBtn = document.getElementById('chatBtn');
const chatModal = document.getElementById('chatModal');
const chatClose = document.getElementById('chatClose');
const sendChat = document.getElementById('sendChat');
const chatInput = document.getElementById('chatInput');
const chatBody = document.getElementById('chatBody');
const chatAvatar = document.getElementById('chatAvatar');

chatBtn.onclick = () => {
    chatModal.style.display = chatModal.style.display === 'flex' ? 'none' : 'flex';
};

chatClose.onclick = () => { chatModal.style.display = 'none'; };

let dragging = false, startX=0, startY=0, origRight=30, origBottom=30;
chatBtn.addEventListener('mousedown', (e)=>{
    dragging = true; startX = e.clientX; startY = e.clientY; chatBtn.style.transition='none';
    e.preventDefault();
});
window.addEventListener('mouseup', ()=>{
    if (dragging) {
        dragging=false;
        chatBtn.style.transition='all 0.3s';
        origRight = parseInt(chatBtn.style.right || 30);
        origBottom = parseInt(chatBtn.style.bottom || 30);
    }
});
window.addEventListener('mousemove', (e)=>{
    if (!dragging) return;
    const dx = startX - e.clientX;
    const dy = startY - e.clientY;
    chatBtn.style.right = (origRight + dx) + 'px';
    chatBtn.style.bottom = (origBottom + dy) + 'px';
});

if (chatAvatar) {
    chatAvatar.style.boxShadow = '0 6px 20px rgba(2,6,23,0.12)';
}

async function callZhipuAI(message) {
    const API_KEY = "69c729c061af4cf590f6079d0ea1c1cb.J7RQE5IslWO6rnzT";
    const response = await fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
            model: "glm-4",
            messages: [
                { role: "system", content: "你是专业的垃圾分类助手，只回答垃圾分类相关问题，回答简洁准确、专业友好。" },
                { role: "user", content: message }
            ],
            temperature: 0.3
        })
    });
    const data = await response.json();
    return data.choices?.[0]?.message?.content || "抱歉，我暂时无法回答。";
}

function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = isUser ? 'msg-user' : 'msg-bot';
    div.innerText = text;
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
}

sendChat.onclick = async () => {
    const msg = chatInput.value.trim();
    if (!msg) return;
    addMessage(msg, true);
    chatInput.value = '';
    const reply = await callZhipuAI(msg);
    addMessage(reply);
};

chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChat.click();
});
