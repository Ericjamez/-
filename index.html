<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepVision Pro | 垃圾分类 AI 工作站</title>
    <script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0fdf4; font-family: 'Inter', 'PingFang SC', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border: 1px solid #dcfce7; border-radius: 32px; }
        .emerald-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .train-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body class="min-h-screen pb-20 px-4 md:px-8">

<div class="max-w-7xl mx-auto py-10">
    <header class="flex flex-col md:flex-row justify-between items-center mb-12">
        <div class="flex items-center space-x-6">
            <div class="w-16 h-16 emerald-gradient rounded-3xl flex items-center justify-center text-white shadow-xl rotate-3">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-4xl font-black text-emerald-900 tracking-tighter italic">DeepVision <span class="text-emerald-500 font-light">Pro 5.5</span></h1>
                <p class="text-emerald-600/60 text-[10px] font-black uppercase tracking-[0.3em]">私有微调 BERT 垃圾分类引擎</p>
            </div>
        </div>
        <div class="bg-white px-8 py-3 rounded-full border border-emerald-100 shadow-sm flex items-center space-x-4 mt-6 md:mt-0">
                <div id="status-dot" class="w-3 h-3 bg-emerald-500 rounded-full train-pulse"></div>
                <span id="status-text" class="text-xs font-bold text-emerald-800 uppercase tracking-widest italic">引擎在线</span>
            </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div class="lg:col-span-4 space-y-8">
            <div class="glass-panel p-8">
                <h3 class="text-sm font-black text-emerald-800 uppercase tracking-widest mb-6 opacity-50 italic text-center">系统监控</h3>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-emerald-50/50 p-6 rounded-[24px] border border-emerald-100 text-center">
                            <p class="text-sm text-emerald-600 font-black mb-1">训练准确率</p>
                            <p class="text-sm font-black text-emerald-900 italic">95.12%</p>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-[24px] border border-slate-100 text-center">
                            <p class="text-sm text-slate-400 font-black mb-1">响应时延</p>
                            <p id="latency-val" class="text-sm font-black text-slate-700 italic">0ms</p>
                        </div>
                    </div>
                    <div class="p-5 bg-white rounded-2xl border border-emerald-50 shadow-sm">
                        <p class="text-sm text-emerald-500 font-black uppercase mb-1">当前引擎</p>
                          <p class="text-xs text-slate-500 font-medium italic">BERT 语义相似度</p>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-0 overflow-hidden relative">
                <h3 class="p-8 pb-0 text-sm font-black text-emerald-800 uppercase tracking-widest">分类体系关联图</h3>
                <div id="relation-chart" class="w-full h-80"></div>
            </div>
        </div>

        <div class="lg:col-span-8 space-y-8">
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-10 flex items-center pointer-events-none">
                    <svg class="w-10 h-10 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                        <input id="ai-input"
                            class="block w-full pl-24 pr-10 py-8 glass-panel border-none text-3xl md:text-4xl font-black focus:ring-8 focus:ring-emerald-500/10 placeholder-emerald-100 shadow-2xl transition-all"
                            placeholder="输入垃圾名称（如：头发、电池、化妆品）">
                <div class="absolute right-10 top-1/2 -translate-y-1/2 hidden md:block">
                    <span class="px-6 py-3 emerald-gradient text-white text-xs font-black rounded-2xl shadow-lg uppercase tracking-tighter">推理</span>
                </div>
            </div>

            <div id="result-box" class="glass-panel p-12 opacity-0 transform translate-y-10 transition-all duration-700 hidden">
                <div class="flex flex-col md:flex-row gap-16 items-center">
                    <div id="res-icon" class="w-52 h-52 md:w-56 md:h-56 rounded-[48px] shadow-2xl flex items-center justify-center text-white text-6xl md:text-8xl font-black shrink-0 transition-all duration-700">?</div>
                    <div class="flex-1 w-full space-y-8">
                        <div>
                            <span id="res-mode" class="text-[10px] font-black uppercase text-emerald-500 px-4 py-1.5 bg-emerald-50 rounded-lg italic tracking-widest">推理结果</span>
                            <h2 id="res-name" class="text-5xl md:text-6xl lg:text-7xl font-black text-slate-800 tracking-tight mt-4 italic">识别中</h2>
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-end text-xs font-black text-slate-400 uppercase">
                                <span>识别置信度</span>
                                <span id="conf-val" class="text-3xl md:text-4xl font-mono text-emerald-600">0%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-6 rounded-full overflow-hidden p-1.5 shadow-inner">
                                <div id="conf-bar" class="h-full bg-emerald-500 rounded-full w-0 transition-all duration-1000"></div>
                            </div>
                            <div id="token-viz" class="mt-4 flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-16 pt-12 border-t border-emerald-50">
                    <div class="space-y-6 text-left">
                        <h4 class="text-sm font-black text-emerald-800 uppercase tracking-widest opacity-40 italic">投放建议</h4>
                        <div id="res-guide" class="p-6 md:p-8 bg-emerald-50/50 rounded-[28px] border border-emerald-100 text-lg md:text-xl text-emerald-900 font-semibold leading-relaxed shadow-inner"></div>
                    </div>
                    <div class="space-y-6 text-left">
                        <h4 class="text-sm font-black text-emerald-800 uppercase tracking-widest opacity-40 italic">数据分析</h4>
                        <button onclick="window.open('AnalyticsDashboard.html','_blank')" class="w-full py-6 emerald-gradient text-white rounded-[28px] font-black text-sm shadow-xl hover:scale-[1.02] transition active:scale-95 uppercase tracking-widest">
                            进入算法评估看板 →
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const categoryMap = {
    "可回收垃圾": { color: "#3b82f6", icon: "♻️", tip: "适宜回收利用，可循环加工再利用" },
    "有害垃圾": { color: "#ef4444", icon: "⚠️", tip: "含有毒有害物质，需特殊安全处理" },
    "湿垃圾": { color: "#10b981", icon: "🍎", tip: "易腐烂的生物质生活废弃物" },
    "干垃圾": { color: "#64748b", icon: "🗑️", tip: "除以上几类外的其他生活废弃物" },
    "大件垃圾": { color: "#8b5cf6", icon: "🪑", tip: "体积较大、需要拆分处理的废弃物品" }
};

let chart;

window.onload = () => {
    initChart();
    // 不再在输入时自动推理，改由用户点击按钮触发推理
    const inputEl = document.getElementById('ai-input');
    const inferBtn = document.createElement('button');
    inferBtn.id = 'btn-infer';
    inferBtn.className = 'px-6 py-3 emerald-gradient text-white text-xs font-black rounded-2xl shadow-lg uppercase tracking-tighter';
    inferBtn.innerText = '开始推理';
    inferBtn.onclick = () => {
        const val = inputEl.value.trim();
        if (!val) return;
        infer(val).then(res => {
            // 推理成功后保存到 localStorage，标记为 confirmed
            try {
                const hist = JSON.parse(localStorage.getItem('garbage_history') || '[]');
                const entry = {
                    keyword: val,
                    category: res.category || '干垃圾',
                    confidence: typeof res.confidence === 'number' ? res.confidence : (typeof res.confidence === 'string' ? parseFloat(res.confidence) : 0),
                    method: res.method || 'unknown',
                    time: new Date().toLocaleString(),
                    confirmed: true,
                    bert_conf: res.bert_conf || null,
                    vec_conf: res.vec_conf || null,
                    final_conf: res.confidence || null,
                    api_suggested: res.api_suggested || false,
                    suggested_name: res.suggested_name || null,
                    corrected: false,
                    needs_review: !!res.api_suggested
                };
                hist.push(entry);
                localStorage.setItem('garbage_history', JSON.stringify(hist));
            } catch(e) { console.error('保存 history 失败', e); }
        }).catch(()=>{});
    };
    // 将按钮挂到输入右侧
    const wrapper = document.querySelector('.relative.group .absolute.right-10');
    if (wrapper) wrapper.innerHTML = '';
    const rightContainer = document.querySelector('.relative.group');
    if (rightContainer) rightContainer.appendChild(inferBtn);
};

async function infer(val) {
    if(!val) return;
    const startTime = Date.now();
    
    try {
        const response = await fetch('http://127.0.0.1:8000/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: val})
        });
        const data = await response.json();

        if (!response.ok) {
            console.error('后端响应错误', data);
            document.getElementById('status-text').innerText = '后端错误';
            return;
        }

        const category = data.category || '干垃圾';
        const info = categoryMap[category] || categoryMap['干垃圾'];
        updateUI(info, category, data.confidence || 0, data.guide || null, data.matched_sample || null, data.tokens || [], data.token_norms || []);
        document.getElementById('latency-val').innerText = (Date.now() - startTime) + "ms";
        return data;
    } catch (e) {
    console.error("后端未连接", e);
    document.getElementById('status-text').innerText = "后端未连接";
    // 返回兜底结果，保证调用处可以保存历史（标记为 confirmed）
    return { category: '干垃圾', confidence: 0, method: 'offline-fallback', guide: null };
}
}

function updateUI(info, category, conf, guide, matched_sample, tokens = [], token_norms = []) {
    const box = document.getElementById('result-box');
    box.classList.remove('hidden');
    setTimeout(() => box.classList.replace('opacity-0', 'opacity-100'), 50);

    document.getElementById('res-icon').style.backgroundColor = info.color;
    document.getElementById('res-icon').innerText = info.icon;
    
    document.getElementById('res-name').innerText = category;
    document.getElementById('res-name').style.color = info.color;
    document.getElementById('conf-val').innerText = (conf*100).toFixed(1) + '%';
    document.getElementById('conf-bar').style.width = (conf*100) + '%';
    document.getElementById('conf-bar').style.backgroundColor = info.color;
    // 展示优先级：后端的 item 级 guide > matched_sample 指示 > 类级 tip
    const guideEl = document.getElementById('res-guide');
    if (guide) {
        guideEl.innerText = guide;
    } else if (matched_sample) {
        guideEl.innerText = `参考样本「${matched_sample}」的投放建议：` + info.tip;
    } else {
        guideEl.innerText = info.tip;
    }

    // 渲染 token 向量拆分展示（展示 token 及其向量模长，颜色强度反映模长）
    const tokenViz = document.getElementById('token-viz');
    tokenViz.innerHTML = '';
    if (tokens && tokens.length) {
        const maxNorm = token_norms && token_norms.length ? Math.max(...token_norms) : 1;
        tokens.forEach((t, i) => {
            const norm = (token_norms && token_norms[i]) ? token_norms[i] : 0;
            const intensity = Math.min(1, maxNorm ? (norm / maxNorm) : 0);
            const bg = `rgba(16,185,129,${0.12 + 0.6*intensity})`;
            const el = document.createElement('span');
            el.className = 'px-2 py-1 rounded-md text-[12px] border border-slate-100';
            el.style.background = bg;
            el.style.color = '#064e3b';
            el.innerText = `${t} (${norm})`;
            tokenViz.appendChild(el);
        });
    } else {
        tokenViz.innerHTML = '<span class="text-xs text-slate-400 italic">无 token 信息</span>';
    }
}

function initChart() {
    const chartDom = document.getElementById('relation-chart');
    if (typeof echarts === 'undefined') return;
    chart = echarts.init(chartDom);
    chart.setOption({
        series: [{
            type: 'graph', layout: 'force', draggable: true,
            force: { repulsion: 150, edgeLength: 50 },
            label: { show: true, fontSize: 10, fontWeight: 'bold' },
            data: [
                { name: '垃圾分类', symbolSize: 60, itemStyle: { color: '#059669' } },
                { name: '可回收', itemStyle: { color: '#3b82f6' } },
                { name: '有害', itemStyle: { color: '#ef4444' } },
                { name: '湿垃圾', itemStyle: { color: '#10b981' } },
                { name: '干垃圾', itemStyle: { color: '#64748b' } },
                { name: '大件', itemStyle: { color: '#8b5cf6' } },
                { name: '厨余/湿垃圾', itemStyle: { color: '#34d399' } },
                { name: '塑料制品', itemStyle: { color: '#60a5fa' } },
                { name: '纸类', itemStyle: { color: '#fde68a' } },
                { name: '玻璃制品', itemStyle: { color: '#a78bfa' } },
                { name: '电池/有害', itemStyle: { color: '#f87171' } },
                { name: '电子产品', itemStyle: { color: '#38bdf8' } },
                { name: '纺织/衣物', itemStyle: { color: '#f472b6' } },
                { name: '大件回收', itemStyle: { color: '#7c3aed' } }
            ],
            links: [
                { source: '垃圾分类', target: '可回收' },
                { source: '垃圾分类', target: '有害' },
                { source: '垃圾分类', target: '湿垃圾' },
                { source: '垃圾分类', target: '干垃圾' },
                { source: '垃圾分类', target: '大件' },
                { source: '湿垃圾', target: '厨余/湿垃圾' },
                { source: '可回收', target: '塑料制品' },
                { source: '可回收', target: '纸类' },
                { source: '可回收', target: '玻璃制品' },
                { source: '有害', target: '电池/有害' },
                { source: '可回收', target: '电子产品' },
                { source: '干垃圾', target: '纺织/衣物' },
                { source: '大件', target: '大件回收' }
            ]
        }]
    });
}

window.onresize = () => chart && chart.resize();
</script>
</body>
</html>
